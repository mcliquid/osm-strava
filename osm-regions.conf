# Region configuration for update-osm.sh
#
# Geofabrik URLs are the official download.geofabrik.de hierarchy, not guesses.
# Add a new [region] block to support another detector area.

[mallorca]
# Spain → Islas Baleares (contains Mallorca, Menorca, Ibiza, Formentera).
# https://download.geofabrik.de/europe/spain/islas-baleares.html
display_name=Mallorca
challenge_ride=Strava Mallorca Ride
challenge_run=Strava Mallorca Run
challenge_all=Strava Mallorca All
zoom=14
geofabrik_url=https://download.geofabrik.de/europe/spain/islas-baleares-latest.osm.pbf
source_pbf=osm-data/sources/islas-baleares-latest.osm.pbf
boundary=boundaries/mallorca.geojson
extract_pbf=osm-data/mallorca/current.osm.pbf
extract_xml=osm-data/mallorca/current.osm
bbox_lon_min=1.5
bbox_lon_max=4.5
bbox_lat_min=38.5
bbox_lat_max=41.0
source_min_bytes=10000000
source_max_bytes=200000000
min_nodes=10000
min_ways=1000
min_relations=10

[bodenseekreis]
# Germany → Baden-Württemberg → Regierungsbezirk Tübingen.
# Smallest Geofabrik extract that fully contains Bodenseekreis (~120 MB).
# https://download.geofabrik.de/europe/germany/baden-wuerttemberg/tuebingen-regbez.html
# Do not use the 616 MB Baden-Württemberg file unless this subregion disappears.
display_name=Bodenseekreis
challenge_ride=Strava Bodenseekreis Ride
challenge_run=Strava Bodenseekreis Run
challenge_all=Strava Bodenseekreis All
zoom=14
geofabrik_url=https://download.geofabrik.de/europe/germany/baden-wuerttemberg/tuebingen-regbez-latest.osm.pbf
source_pbf=osm-data/sources/tuebingen-regbez-latest.osm.pbf
boundary=boundaries/bodenseekreis.geojson
extract_pbf=osm-data/bodenseekreis/current.osm.pbf
extract_xml=osm-data/bodenseekreis/current.osm
bbox_lon_min=8.7
bbox_lon_max=10.1
bbox_lat_min=47.3
bbox_lat_max=48.2
source_min_bytes=30000000
source_max_bytes=400000000
min_nodes=10000
min_ways=1000
min_relations=10
